<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Goals · MyTasks</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <style>
    .goal-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); }

    .goal {
      position: relative; overflow: hidden;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }
    .goal::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 4px;
      background: var(--goal-color, var(--accent));
    }
    .goal__top { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 14px; }
    .goal__icon {
      width: 40px; height: 40px; flex: none;
      display: grid; place-items: center;
      border-radius: 11px; font-size: 1.15rem;
      background: color-mix(in srgb, var(--goal-color, var(--accent)) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--goal-color, var(--accent)) 42%, transparent);
    }
    .goal__name { font-weight: 700; font-size: 0.97rem; }
    .goal__count { font-size: 0.76rem; color: var(--text-muted); }
    .goal__actions { margin-left: auto; display: flex; gap: 5px; flex: none; }
    .goal__name { line-height: 1.3; }

    /* Progress rail: one proportion, one colour, direct-labelled. */
    .goal__rail {
      height: 7px; border-radius: 4px; overflow: hidden;
      background: var(--surface-3); display: flex; gap: 2px;
    }
    .goal__rail span { display: block; background: var(--goal-color, var(--accent)); border-radius: 4px; }
    .goal__legend {
      display: flex; justify-content: space-between;
      font-size: 0.76rem; color: var(--text-secondary); margin-top: 9px;
    }

    .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
    .swatch {
      width: 30px; height: 30px; border-radius: 9px;
      border: 2px solid transparent; cursor: pointer; padding: 0;
    }
    .swatch[aria-pressed="true"] { border-color: var(--text-primary); }

    .icon-picker { display: flex; flex-wrap: wrap; gap: 7px; }
    .icon-opt {
      width: 38px; height: 38px; font-size: 1.05rem;
      border-radius: 10px; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border);
    }
    .icon-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

    .bulk-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--surface-1); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px;
      font-size: 0.85rem; color: var(--text-secondary);
    }
    .bulk-bar__actions { display: flex; gap: 8px; }

    .goal { transition: border-color .12s, background .12s; }
    .goal--selected { border-color: var(--accent); background: var(--accent-soft); }
    .goal__select {
      width: 20px; height: 20px; cursor: pointer; accent-color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-shell="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar__title">
          <h1>Goals</h1>
          <p data-slot="subtitle">The buckets your tasks live in.</p>
        </div>
        <div class="topbar__actions">
          <button class="btn btn--ghost" data-action="toggle-select">Select</button>
          <button class="btn btn--primary" data-action="new-category"></button>
        </div>
      </header>

      <div class="bulk-bar" data-slot="bulk-bar" hidden>
        <span data-slot="bulk-count">0 selected</span>
        <div class="bulk-bar__actions">
          <button class="btn btn--ghost btn--sm" data-action="select-all">Select all</button>
          <button class="btn btn--danger btn--sm" data-action="delete-selected" disabled>Delete</button>
        </div>
      </div>

      <div class="goal-grid" data-slot="grid"></div>
    </main>
  </div>

  <script type="module" src="assets/js/page-categories.js"></script>
</body>
</html>
