<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Tasks · MyTasks</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-shell="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar__title">
          <h1>Tasks</h1>
          <p data-slot="subtitle">Everything on your plate.</p>
        </div>
        <div class="topbar__actions">
          <button class="btn btn--primary" data-action="new-task"></button>
        </div>
      </header>

      <!-- Filters in one row above the content -->
      <div class="filters">
        <div class="segmented" role="group" aria-label="Time range">
          <button data-range=""         aria-pressed="true">All</button>
          <button data-range="today"    aria-pressed="false">Today</button>
          <button data-range="week"     aria-pressed="false">7 days</button>
          <button data-range="overdue"  aria-pressed="false">Overdue</button>
        </div>

        <label class="visually-hidden" for="f-status">Status</label>
        <select id="f-status">
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
          <option value="">Any status</option>
        </select>

        <label class="visually-hidden" for="f-priority">Priority</label>
        <select id="f-priority">
          <option value="">Any priority</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <label class="visually-hidden" for="f-category">Goal</label>
        <select id="f-category"><option value="">Any goal</option></select>

        <label class="visually-hidden" for="f-search">Search</label>
        <input type="text" id="f-search" placeholder="Search tasks…" style="min-width:190px">

        <div class="filters__spacer"></div>

        <label class="visually-hidden" for="f-sort">Sort</label>
        <select id="f-sort">
          <option value="due_date">By due date</option>
          <option value="priority">By priority</option>
          <option value="created_at">Newest first</option>
          <option value="title">A–Z</option>
        </select>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div data-slot="list"></div>
      </div>

      <div data-slot="pager" style="display:flex;gap:10px;align-items:center;justify-content:center;margin-top:18px"></div>
    </main>
  </div>

  <script type="module" src="assets/js/page-tasks.js"></script>
</body>
</html>
