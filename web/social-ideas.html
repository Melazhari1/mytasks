<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Social Ideas · MyTasks</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <style>
    .idea-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

    .idea-card {
      display: flex; flex-direction: column; gap: 10px;
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }
    .idea-card__badges { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 26px; }
    .idea-card__badges .pill { margin-left: auto; }
    .idea-card__label { font-size: 0.72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-muted); }
    .idea-card__idea { font-size: 0.92rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .idea-card__divider { border: none; border-top: 1px dashed var(--border); margin: 0; }
    .idea-card__links { font-size: 0.83rem; line-height: 1.6; color: var(--text-secondary); word-break: break-word; }
    .idea-card__links a { color: var(--accent); }
    .idea-card__links .none { color: var(--text-muted); font-style: italic; }
    .idea-card__actions { margin-top: auto; display: flex; justify-content: flex-end; gap: 6px; padding-top: 4px; }

    .social-badge {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 50%; font-weight: 700; flex: none; line-height: 1;
    }

    .platform-picker { display: flex; flex-wrap: wrap; gap: 8px; }
    .platform-opt {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 6px 12px 6px 6px; border-radius: 999px; cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border);
      font-size: 0.83rem; color: var(--text-secondary);
    }
    .platform-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--text-primary); }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" data-shell="sidebar"></aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar__title">
          <h1>Social Ideas</h1>
          <p data-slot="subtitle">Content ideas, with links, tagged by platform.</p>
        </div>
        <div class="topbar__actions">
          <button class="btn btn--primary" data-action="new-idea"></button>
        </div>
      </header>

      <div class="filters">
        <label class="visually-hidden" for="f-status">Status</label>
        <select id="f-status">
          <option value="">Any status</option>
          <option value="pending">Pending</option>
          <option value="future">Future</option>
          <option value="done">Done</option>
        </select>

        <label class="visually-hidden" for="f-platform">Platform</label>
        <select id="f-platform"><option value="">Any platform</option></select>

        <label class="visually-hidden" for="f-search">Search</label>
        <input type="text" id="f-search" placeholder="Search ideas and links…" style="min-width:220px">
      </div>

      <div class="idea-grid" data-slot="grid"></div>

      <div data-slot="pager" style="display:flex;gap:10px;align-items:center;justify-content:center;margin-top:18px"></div>
    </main>
  </div>

  <script type="module" src="assets/js/page-social-ideas.js"></script>
</body>
</html>
